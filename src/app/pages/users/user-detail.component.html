<main class="user-detail-page">
  <h1>User details</h1>

  @if (loading) {
    <p>Loading user details…</p>
  } @else if (errorMessage) {
    <p role="alert" class="text-danger">{{ errorMessage }}</p>
  } @else {
    <form [formGroup]="userForm">
      <p>
        <label for="id">User ID</label><br />
        <input id="id" type="text" formControlName="id" />
      </p>
      <p>
        <label for="login">Login</label><br />
        <input id="login" type="text" formControlName="login" />
      </p>
      <p>
        <label for="password">Password</label><br />
        <input id="password" type="text" formControlName="password" />
      </p>
      <p>
        <label for="firstName">First name</label><br />
        <input id="firstName" type="text" formControlName="firstName" />
      </p>
      <p>
        <label for="lastName">Last name</label><br />
        <input id="lastName" type="text" formControlName="lastName" />
      </p>

      <p>
        <label for="createdAt">Created at</label><br />
        <input id="createdAt" type="text" formControlName="createdAt" />
      </p>
    </form>
  }

  <a routerLink="/users">Back to users</a>
</main>
