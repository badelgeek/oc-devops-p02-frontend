<main class="user-detail-page">
  <div class="user-detail-header">
    <h1>User details</h1>
    @if (!loading && !errorMessage && !isEditMode) {
      <button
        class="edit-user-button"
        type="button"
        (click)="setEditMode(true)"
        aria-label="Edit user"
        title="Edit user"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z" />
        </svg>
      </button>
    }
  </div>

  @if (loading) {
    <p>Loading user details…</p>
  } @else if (errorMessage) {
    <p role="alert" class="text-danger">{{ errorMessage }}</p>
  } @else {
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <p>
        <label for="id">User ID</label><br />
        <input id="id" type="text" formControlName="id" />
      </p>
      <p>
        <label for="login">Login</label><br />
        <input id="login" type="text" formControlName="login" />
      </p>
      <p>
        <label for="password">{{ isEditMode ? 'New password (optional)' : 'Password' }}</label><br />
        <input
          id="password"
          [type]="isEditMode ? 'password' : 'text'"
          formControlName="password"
          [placeholder]="isEditMode ? 'Leave blank to keep the current password' : '********'"
        />
      </p>
      <p>
        <label for="firstName">First name</label><br />
        <input id="firstName" type="text" formControlName="firstName" />
      </p>
      <p>
        <label for="lastName">Last name</label><br />
        <input id="lastName" type="text" formControlName="lastName" />
      </p>

      <p>
        <label for="createdAt">Created at</label><br />
        <input id="createdAt" type="text" formControlName="createdAt" />
      </p>

      @if (errorMessage) {
        <p role="alert" class="text-danger">{{ errorMessage }}</p>
      }
      @if (successMessage) {
        <p role="status">{{ successMessage }}</p>
      }

      @if (isEditMode) {
        <button type="submit" [disabled]="saving || userForm.invalid">
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
        <button type="button" (click)="cancelEditing()" [disabled]="saving">Cancel</button>
      }
    </form>
  }

  <a routerLink="/users">Back to users</a>
</main>
